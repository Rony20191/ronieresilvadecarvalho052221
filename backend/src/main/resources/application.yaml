spring:
  application:
    name: music-catalog-manage
  base-path: /api
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/music_catalog_manage
    username: postgres
    password: lobcat123@@
    driver-class-name: org.postgresql.Driver
  cache:
    type: redis
  redis:
    host: localhost
    port: 6379
    password: RedisPass
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/music
          jwk-set-uri: http://keycloak:8080/realms/music/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
      mapping: /metrics
