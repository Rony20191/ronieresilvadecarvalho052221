server:
  servlet:
    context-path: /api
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html


spring:
  application:
    name: music-catalog-manage
  config:
    activate:
      on-profile: prod
  base-path: /api
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    ignore-missing-migrations: true
    locations:
      - classpath:db/migration
    placeholders:
      is_dev: false
  datasource:
    url: jdbc:postgresql://postgres:5432/music_catalog_manage
    username: postgres
    password: lobcat123@@
    driver-class-name: org.postgresql.Driver
  minio:
    url: http://minio:9000
    bucket: music-catalog
    access-key: minioadmin
    secret-key: xukiliiiii
  cache:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: 6379
      password: admin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/music
          jwk-set-uri: http://keycloak:8080/realms/music/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
      mapping: /metrics

app:
  external:
    regional-api-url: https://integrador-argus-api.geia.vip/v1/regionais
  keycloak:
    server-url: http://keycloak:8080
    realm: music-app
    client-id: music-app-client2
    client-secret: FdBzYFPVIo20FgDrVZyrtpsxz9PVOate
