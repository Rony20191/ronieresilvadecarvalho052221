spring.application.name=music-catalog-manage


#jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/music_catalog_manage
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


#oauth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/music
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/music/protocol/openid-connect/certs


